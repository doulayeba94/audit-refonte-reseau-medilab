<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture réseau cible de MediLab</title>
<desc>Siège avec NGFW et SIEM, segmentation VLAN et contrôle d'accès 802.1X/NAC, connecté à trois laboratoires (dont un nouveau) via VPN chiffré avec QoS.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#595E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="330" fill="#FFFFFF"/>

<line x1="400" y1="68" x2="458" y2="68" stroke="#595E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M290 96 L130 96 L130 220" fill="none" stroke="#595E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="220" stroke="#595E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M290 96 L550 96 L550 220" fill="none" stroke="#595E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="160" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">VPN IPSec chiffré + QoS</text>

<rect x="180" y="40" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="290" y="62" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle">Siège (Paris)</text>
<text x="290" y="82" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle">NGFW + SIEM centralisé</text>

<rect x="460" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="550" y="62" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">802.1X / NAC</text>
<text x="550" y="82" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">VLANs biomed/bureau/voix</text>

<rect x="40" y="220" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="242" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Laboratoire A</text>
<text x="130" y="262" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle">VLAN segmenté, flux chiffrés</text>

<rect x="250" y="220" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="242" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Laboratoire B</text>
<text x="340" y="262" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle">VLAN segmenté, flux chiffrés</text>

<rect x="460" y="220" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="550" y="242" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402" text-anchor="middle">Laboratoire C</text>
<text x="550" y="262" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle">Nouveau site (expansion)</text>
</svg>
