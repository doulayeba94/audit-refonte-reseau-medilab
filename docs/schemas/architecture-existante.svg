<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture réseau existante de MediLab</title>
<desc>Siège relié à deux laboratoires via VPN IPSec, VLAN unique, pare-feu simple ACL.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#595E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="330" fill="#FFFFFF"/>

<path d="M210 96 L140 96 L140 230" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M470 96 L540 96 L540 230" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="130" stroke="#595E5A" stroke-width="0.5"/>

<text x="150" y="180" font-family="sans-serif" font-size="12" fill="#5F5E5A">VPN IPSec</text>
<text x="470" y="180" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="end">VPN IPSec</text>

<rect x="210" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Siège (Paris)</text>
<text x="340" y="82" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">Pare-feu ACL, LIMS/Exchange/IPBX</text>

<rect x="270" y="130" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="150" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">VLAN unique</text>
<text x="340" y="168" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">Données + voix + Wi-Fi</text>

<rect x="40" y="230" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="252" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Laboratoire A</text>
<text x="140" y="272" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle">60 postes, VoIP G.711</text>

<rect x="440" y="230" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="252" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Laboratoire B</text>
<text x="540" y="272" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle">Serveur LIMS local</text>
</svg>
